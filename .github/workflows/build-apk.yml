
name: Build Ryuza Official APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK versi terbaru
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Install Android platform dan build tools
      - name: Install SDK Packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # Install project dependencies
      - name: Install Dependencies
        run: npm install

      # Tambahkan Android ke Capacitor
      - name: Add Android Platform
        run: npx cap add android

      # Sinkronisasi file HTML
      - name: Sync Capacitor
        run: npx cap sync android

      # Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Upload APK ke GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryuza-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
