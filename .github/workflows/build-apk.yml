
name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Ryuza Official APK
    runs-on: ubuntu-latest

    steps:
      # Mengambil source code dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menyiapkan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Menyiapkan Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Menyiapkan Android SDK beserta paket yang diperlukan
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # Memasang dependency project
      - name: Install Dependencies
        run: npm install

      # Membuat project Android
      - name: Add Android Platform
        run: npx cap add android

      # Sinkronisasi HTML dengan Android
      - name: Sync Capacitor
        run: npx cap sync android

      # Build APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Upload hasil APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryuza-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
