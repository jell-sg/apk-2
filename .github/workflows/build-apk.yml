
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Prepare Android
        run: node scripts/prepare-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Minimum SDK to 24
        run: |
          FILE="android/variables.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' "$FILE"
            sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' "$FILE"
          fi

          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/minSdkVersion 23/minSdkVersion 24/g' "$FILE"
            sed -i 's/minSdkVersion 22/minSdkVersion 24/g' "$FILE"
          fi

          grep -R "minSdkVersion" android/

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYUZA-CREATOR-HUB-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
