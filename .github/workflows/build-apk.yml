name: Build Ryuza Creator Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ryuza-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_COMPILE_SDK: 35
      ANDROID_BUILD_TOOLS: 35.0.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu-latest image already includes Android SDK.
      # Avoid setup-android here because its sdkmanager bootstrap was
      # failing in the user's previous run while fetching remote metadata.
      - name: Verify and install Android SDK packages if needed
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager tidak ditemukan dan Android SDK package belum tersedia."
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            [ -d "$ANDROID_HOME/platforms/android-35" ] || "$SDKMANAGER" "platforms;android-35"
            [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || "$SDKMANAGER" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android Platform
        run: npx cap add android

      - name: Configure Ryuza Native Tools and minSdk 24
        run: node scripts/prepare-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify minSdkVersion
        working-directory: android
        shell: bash
        run: |
          grep -n "minSdkVersion" app/build.gradle
          grep -q "minSdkVersion 24" app/build.gradle

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ryuza-Creator-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
